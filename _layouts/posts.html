---
layout: portfolio
---
<a class="text-link" href="{{ '/' | relative_url }}">← Home</a>
<h1>Writing</h1>
<div class="prose">{{ content }}</div>
<ul class="entries writing-list">
{% for post in site.posts %}
{% unless post.hidden %}
<li>
<p class="eyebrow">{{ post.date | date: '%B %-d, %Y' }}</p>
<h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
<p>{{ post.excerpt | strip_html | truncatewords: 35 }}</p>
</li>
{% endunless %}
{% endfor %}
</ul>
